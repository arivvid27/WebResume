<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
    <style media="screen">
      :root {
        --color-primary: #FCFCFD;
        --color-secondary: #A7B0B8;
        --color-tertiary: #7D8A98;
        --color-neutral: #171A1C;
        --color-surface: #212529;
        --color-border: #30363D;
        --color-accent: #E1753E;
      }
      * { box-sizing: border-box; }
      body {
        background: var(--color-neutral);
        color: var(--color-primary);
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #message { max-width: 420px; text-align: left; }
      #message h2 { color: var(--color-accent); font-weight: 400; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 12px; }
      #message h1 { font-size: clamp(2rem, 5vw, 2.75rem); font-weight: 300; letter-spacing: -0.02em; margin: 0 0 16px; }
      #message p { line-height: 1.6; margin: 0 0 28px; font-size: 15px; color: var(--color-secondary); }
      #message a {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--color-primary);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        padding: 12px 20px;
        border-radius: 9999px;
        font-size: 13px;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      #message a:hover { border-color: var(--color-tertiary); transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <div id="message">
      <h2>404 error</h2>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist. It may have moved, or the link may be out of date.</p>
      <a href="/">Back to home</a>
    </div>
  </body>
</html>
